[package]
name = "moru-artemis"
version = "26.47.1"
edition = "2021"
license = "Apache-2.0"
description = "Host-driven Android MCP server in Rust"

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
quick-xml = "0.37"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
